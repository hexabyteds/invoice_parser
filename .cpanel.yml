---
# cPanel Git Version Control deployment tasks.
#
# Triggered by: uapi VersionControlDeployment create repository_root=...
# (called remotely, with no SSH needed, by scripts/deploy.sh)
#
# This repo IS the live app directory (REPO_PATH == APP_PATH), so these
# tasks run in-place — no rsync to a separate deployment path needed.
#
# Each list item below runs as its own shell command (sh -c "..."), so PATH
# and cwd changes made with "export"/"cd" only apply within that same line —
# that's why every line that needs Node re-exports PATH and re-cd's.
#
# Logs: ~/.cpanel/logs/vc_<timestamp>_git_deploy.log
deployment:
  tasks:
    - /bin/mkdir -p /home/apexhome/eazeebooks.com/tmp
    - export PATH=/home/apexhome/nodevenv/eazeebooks.com/20/bin:$PATH && cd /home/apexhome/eazeebooks.com/frontend && npm install --no-audit --no-fund && npm run build
    - /bin/cp -a /home/apexhome/eazeebooks.com/frontend/dist/. /home/apexhome/eazeebooks.com/public/
    - export PATH=/home/apexhome/nodevenv/eazeebooks.com/20/bin:$PATH && cd /home/apexhome/eazeebooks.com && npm install --omit=dev --no-audit --no-fund
    - export PATH=/home/apexhome/nodevenv/eazeebooks.com/20/bin:$PATH && cd /home/apexhome/eazeebooks.com && node scripts/migrate.js
    - export PATH=/home/apexhome/nodevenv/eazeebooks.com/20/bin:$PATH && cd /home/apexhome/eazeebooks.com && bash scripts/snapshot-schema.sh db/schema.production.sql || true
    - /usr/bin/touch /home/apexhome/eazeebooks.com/tmp/restart.txt
