<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Invoice Agent</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      margin-top: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .upload-area {
      border: 2px dashed #667eea;
      border-radius: 8px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .upload-area:hover {
      background: #f8f9ff;
      border-color: #764ba2;
    }

    .upload-area.dragover {
      background: #f0f4ff;
      border-color: #764ba2;
    }

    .upload-area input {
      display: none;
    }

    .upload-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .upload-text {
      color: #333;
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    .upload-hint {
      color: #999;
      font-size: 0.9em;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .metric {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .metric-value {
      font-size: 2em;
      font-weight: bold;
      margin: 10px 0;
    }

    .metric-label {
      font-size: 0.9em;
      opacity: 0.9;
    }

    .invoice-card {
      background: #f9f9f9;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 4px;
    }

    .invoice-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .invoice-client {
      font-weight: bold;
      color: #333;
      font-size: 1.1em;
    }

    .invoice-amount {
      font-size: 1.2em;
      font-weight: bold;
      color: #667eea;
    }

    .invoice-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.9em;
      color: #666;
    }

    .invoice-detail-item {
      display: flex;
      justify-content: space-between;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 1;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      flex: 1;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-small {
      padding: 5px 12px;
      font-size: 0.85em;
    }

    .loading {
      text-align: center;
      color: #667eea;
      font-size: 1.1em;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .confidence {
      display: inline-block;
      background: #e7f3ff;
      color: #0066cc;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.85em;
      margin-left: 10px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #f0f0f0;
    }

    .tab {
      padding: 10px 20px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      color: #666;
      cursor: pointer;
      font-weight: 500;
    }

    .tab.active {
      border-bottom-color: #667eea;
      color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .no-data {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }

    .type-badge {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 0.8em;
      margin-left: 5px;
    }

    .line-items-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.85em;
    }

    .line-items-table th {
      background: #667eea;
      color: white;
      padding: 8px;
      text-align: left;
      font-weight: 500;
    }

    .line-items-table td {
      padding: 8px;
      border-bottom: 1px solid #e0e0e0;
      color: #444;
    }

    .amounts-breakdown {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
      font-size: 0.9em;
    }

    .amount-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      color: #555;
    }

    .amount-row.total {
      font-weight: bold;
      font-size: 1.05em;
      color: #333;
      border-top: 2px solid #667eea;
      margin-top: 6px;
      padding-top: 8px;
    }

    .invoice-description {
      margin-top: 8px;
      font-size: 0.9em;
      color: #555;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function InvoiceApp() {
      const [files, setFiles] = useState([]);
      const [loading, setLoading] = useState(false);
      const [invoices, setInvoices] = useState([]);
      const [stats, setStats] = useState(null);
      const [activeTab, setActiveTab] = useState('upload');
      const [message, setMessage] = useState(null);

      // Fetch data on mount
      useEffect(() => {
        fetchStats();
        fetchInvoices();
      }, []);

      async function fetchStats() {
        try {
          const res = await fetch('/api/stats');
          const data = await res.json();
          if (data.success) {
            setStats(data.stats);
          }
        } catch (error) {
          console.error('Error fetching stats:', error);
        }
      }

      async function fetchInvoices() {
        try {
          const res = await fetch('/api/invoices');
          const data = await res.json();
          if (data.success) {
            setInvoices(data.invoices);
          }
        } catch (error) {
          console.error('Error fetching invoices:', error);
        }
      }

      function handleDragOver(e) {
        e.preventDefault();
        e.target.classList.add('dragover');
      }

      function handleDragLeave(e) {
        e.target.classList.remove('dragover');
      }

      async function handleFiles(fileList) {
        const imageFiles = Array.from(fileList).filter(file => 
          file.type.startsWith('image/')
        );

        if (imageFiles.length === 0) {
          setMessage({ type: 'error', text: 'Please select image files only' });
          return;
        }

        setFiles(imageFiles);
        await processFiles(imageFiles);
      }

      async function processFiles(fileList) {
        setLoading(true);
        setMessage(null);

        for (const file of fileList) {
          try {
            const formData = new FormData();
            formData.append('image', file);

            const response = await fetch('/api/upload', {
              method: 'POST',
              body: formData,
            });

            const data = await response.json();

            if (data.success) {
              const inv = data.invoice;
              const itemCount = (inv.lineItems || []).length;
              setMessage({
                type: 'success',
                text: `✅ ${inv.clientName} — ${itemCount} item(s) — Total: ${inv.currency} ${parseFloat(inv.totalAmount).toLocaleString()} (VAT: ${inv.currency} ${parseFloat(inv.vatAmount).toLocaleString()})`,
              });
              setTimeout(() => {
                fetchStats();
                fetchInvoices();
                setMessage(null);
              }, 1500);
            } else {
              setMessage({ type: 'error', text: `Error: ${data.error}` });
            }
          } catch (error) {
            setMessage({ type: 'error', text: `Upload failed: ${error.message}` });
          }
        }

        setLoading(false);
      }

      function handleDropZone(e) {
        e.preventDefault();
        e.target.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      }

      return (
        <div className="container">
          <div className="header">
            <h1>🤖 Invoice Agent</h1>
            <p>Upload invoices, extract data, save to Excel</p>
            <div className="badge">Powered by Google Gemini</div>
          </div>

          {message && (
            <div className={message.type}>
              {message.text}
            </div>
          )}

          <div className="grid">
            {/* Upload Card */}
            <div className="card">
              <h2>📸 Upload Invoice</h2>
              
              <div 
                className="upload-area"
                onDragOver={handleDragOver}
                onDragLeave={handleDragLeave}
                onDrop={handleDropZone}
                onClick={() => document.getElementById('fileInput').click()}
              >
                <input 
                  id="fileInput"
                  type="file"
                  multiple
                  accept="image/*"
                  onChange={(e) => handleFiles(e.target.files)}
                />
                <div className="upload-icon">📤</div>
                <div className="upload-text">Drop images here or click</div>
                <div className="upload-hint">Supports: JPG, PNG, GIF</div>
              </div>

              {loading && (
                <div className="loading" style={{ marginTop: '20px' }}>
                  <div className="spinner"></div>
                  Processing invoice (5-10 seconds)...
                </div>
              )}

              <div className="button-group">
                <button 
                  className="btn-primary"
                  onClick={() => window.location.href = '/api/download-excel'}
                >
                  📥 Download Excel
                </button>
                <button 
                  className="btn-secondary"
                  onClick={() => window.location.href = '/api/report'}
                >
                  📈 View Report
                </button>
              </div>
            </div>

            {/* Stats Card */}
            <div className="card">
              <h2>📊 Statistics</h2>
              
              {stats ? (
                <div className="metrics">
                  <div className="metric">
                    <div className="metric-label">Total Invoices</div>
                    <div className="metric-value">{stats.totalInvoices}</div>
                  </div>
                  <div className="metric">
                    <div className="metric-label">Unique Clients</div>
                    <div className="metric-value">{stats.uniqueClients}</div>
                  </div>
                  <div className="metric">
                    <div className="metric-label">Total Amount</div>
                    <div className="metric-value">{stats.currency}</div>
                  </div>
                  <div className="metric">
                    <div className="metric-label">Total Amount</div>
                    <div className="metric-value">{parseFloat(stats.totalAmount).toLocaleString()}</div>
                  </div>
                </div>
              ) : (
                <div className="no-data">Loading...</div>
              )}

              <div className="button-group">
                <button 
                  className="btn-secondary"
                  onClick={() => {
                    if (window.confirm('Clear all data?')) {
                      fetch('/api/clear', { method: 'POST' })
                        .then(() => {
                          fetchStats();
                          fetchInvoices();
                          setMessage({ type: 'success', text: 'All data cleared' });
                        });
                    }
                  }}
                >
                  🗑️ Clear All
                </button>
              </div>
            </div>
          </div>

          {/* Invoices List */}
          <div className="card">
            <h2>📋 Processed Invoices</h2>

            {invoices.length === 0 ? (
              <div className="no-data">
                No invoices yet. Upload images to get started! 📸
              </div>
            ) : (
              <div>
                <div style={{ marginBottom: '20px', color: '#666' }}>
                  Total: {invoices.length} invoice(s)
                </div>
                {invoices.map((invoice, idx) => (
                  <div key={idx} className="invoice-card">
                    <div className="invoice-card-header">
                      <div>
                        <div className="invoice-client">
                          {invoice.clientName}
                          <span className="type-badge">{invoice.invoiceType}</span>
                        </div>
                      </div>
                      <div className="invoice-amount">
                        {invoice.currency} {parseFloat(invoice.totalAmount).toLocaleString()}
                      </div>
                    </div>
                    <div className="invoice-details">
                      <div className="invoice-detail-item">
                        <span>Invoice ID:</span>
                        <span>{invoice.invoiceNo}</span>
                      </div>
                      <div className="invoice-detail-item">
                        <span>Date:</span>
                        <span>{invoice.invoiceDate}</span>
                      </div>
                      <div className="invoice-detail-item">
                        <span>Phone:</span>
                        <span>{invoice.phoneNumber || '-'}</span>
                      </div>
                    </div>

                    {invoice.description && !(invoice.lineItems || []).length && (
                      <div className="invoice-description">
                        {invoice.description}
                      </div>
                    )}

                    {(invoice.lineItems || []).length > 0 && (
                      <table className="line-items-table">
                        <thead>
                          <tr>
                            <th>Description</th>
                            <th>Qty</th>
                            <th>Unit Price</th>
                            <th>Amount</th>
                          </tr>
                        </thead>
                        <tbody>
                          {invoice.lineItems.map((item, i) => (
                            <tr key={i}>
                              <td>{item.description || '-'}</td>
                              <td>{item.quantity || 0}</td>
                              <td>{invoice.currency} {parseFloat(item.unitPrice || 0).toLocaleString()}</td>
                              <td>{invoice.currency} {parseFloat(item.amount || 0).toLocaleString()}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}

                    <div className="amounts-breakdown">
                      <div className="amount-row">
                        <span>Subtotal</span>
                        <span>{invoice.currency} {parseFloat(invoice.subtotal || 0).toLocaleString()}</span>
                      </div>
                      <div className="amount-row">
                        <span>VAT{invoice.vatRate ? ` (${invoice.vatRate}%)` : ''}</span>
                        <span>{invoice.currency} {parseFloat(invoice.vatAmount || 0).toLocaleString()}</span>
                      </div>
                      <div className="amount-row total">
                        <span>Total</span>
                        <span>{invoice.currency} {parseFloat(invoice.totalAmount).toLocaleString()}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<InvoiceApp />);
  </script>
</body>
</html>
